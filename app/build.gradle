plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ateliersourcedeck.toolbox'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ateliersourcedeck.toolbox'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '1.0.1'
    }

    // 正式簽署金鑰只從環境變數讀取（GitHub Actions 由 Secrets 提供），不會寫進原始碼。
    // 沒有提供金鑰時（本機測試）退回 debug 金鑰，產出的 APK 不可作為正式版發佈。
    def releaseKeystore = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
// 沒有第三方依賴：只用 Android 框架本身，攻擊面與 APK 體積都最小。
